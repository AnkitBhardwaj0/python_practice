<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyTodo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="/"
            >
                MyTodo
            </a>

        </div>

    </nav>


    <!-- Main content -->
    <main class="container my-4">

        <h2 class="text-center mb-4">
            My Todo List
        </h2>


        <!-- Add Todo form -->
        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <h4 class="mb-3">
                    Add a Todo
                </h4>

                <form
                    action="/"
                    method="POST"
                >

                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label"
                        >
                            Todo Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            placeholder="Enter your task"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="description"
                            class="form-label"
                        >
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            id="description"
                            name="description"
                            rows="3"
                            placeholder="Enter task description"
                            required
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Todo
                    </button>

                </form>

            </div>

        </div>


        <!-- Todo table -->
        <h4 class="mb-3">
            Your Todos
        </h4>


        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                    <tr>

                        <th scope="col">
                            #
                        </th>

                        <th scope="col">
                            Title
                        </th>

                        <th scope="col">
                            Description
                        </th>

                        <th scope="col">
                            Created At
                        </th>

                        <th scope="col">
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody>

                    {% if all_todo %}

                        {% for todo in all_todo %}

                        <tr>

                            <th scope="row">
                                {{ loop.index }}
                            </th>

                            <td>
                                {{ todo.title }}
                            </td>

                            <td>
                                {{ todo.desc }}
                            </td>

                            <td>
                                {{ todo.date_created }}
                            </td>

                            <td>

                                <a
                                    href="/delete/{{ todo.sno }}"
                                    class="btn btn-danger btn-sm"
                                >
                                    Delete
                                </a>

                            </td>

                        </tr>

                        {% endfor %}

                    {% else %}

                        <tr>

                            <td
                                colspan="5"
                                class="text-center text-muted"
                            >
                                No Todos added yet.
                            </td>

                        </tr>

                    {% endif %}

                </tbody>

            </table>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
